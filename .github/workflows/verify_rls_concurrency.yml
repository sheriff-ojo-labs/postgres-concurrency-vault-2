name: Verify Non-Privileged RLS & Deterministic NOWAIT Lock

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psycopg2-binary
        run: pip install psycopg2-binary

      - name: Run Non-Privileged RLS & Deterministic NOWAIT Suite
        env:
          ADMIN_DB_DSN: "dbname=postgres user=postgres password=postgres host=localhost port=5432"
          TENANT_DB_DSN: "dbname=postgres user=app_tenant_user password=tenant_secure_pass host=localhost port=5432"
        run: python postgres_concurrency_test.py

      - name: Upload Inspectable Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification_report.json
